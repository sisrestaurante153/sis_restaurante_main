services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sis_restaurante}
      POSTGRES_USER: ${POSTGRES_USER:-sis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sis}
    ports:
      - "${POSTGRES_EXPOSE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sis} -d ${POSTGRES_DB:-sis_restaurante}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: ops
    restart: "no"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://sis:sis@db:5432/sis_restaurante?schema=public}
      IMPORT_STORAGE_DIR: ${IMPORT_STORAGE_DIR:-/data/imports}
      RUN_DB_SEED: ${RUN_DB_SEED:-false}
    command:
      [
        "/bin/sh",
        "-lc",
        "echo '[ops] Aplicando migracoes Prisma' && npx prisma migrate deploy && if [ \"$${RUN_DB_SEED:-false}\" = \"true\" ]; then echo '[ops] Executando seed de bootstrap' && npm run db:seed; else echo '[ops] Seed desativada; defina RUN_DB_SEED=true para popular dados iniciais.'; fi"
      ]
    volumes:
      - import_storage:/data/imports
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://sis:sis@db:5432/sis_restaurante?schema=public}
      IMPORT_STORAGE_DIR: ${IMPORT_STORAGE_DIR:-/data/imports}
    volumes:
      - import_storage:/data/imports
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    networks:
      - backend
      - frontend
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const raw=((process.env.NEXT_PUBLIC_BASE_PATH&&process.env.NEXT_PUBLIC_BASE_PATH.trim())||(() => { try { return new URL(process.env.APP_URL || 'http://localhost:3000').pathname; } catch { return ''; } })()); const base=!raw||raw==='/'?'':'/'+raw.replace(/^\\/+|\\/+$/g,''); const url='http://127.0.0.1:3000'+base+'/api/health'; require('node:http').get(url,(res)=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1));"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  import-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://sis:sis@db:5432/sis_restaurante?schema=public}
      IMPORT_STORAGE_DIR: ${IMPORT_STORAGE_DIR:-/data/imports}
      IMPORT_WORKER_POLL_INTERVAL_MS: ${IMPORT_WORKER_POLL_INTERVAL_MS:-5000}
    command: ["node", "--import", "tsx", "scripts/import-worker.ts"]
    volumes:
      - import_storage:/data/imports
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "test -d /data/imports || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-64m}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  db-backup:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://sis:sis@db:5432/sis_restaurante?schema=public}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    command: ["/bin/sh", "/opt/ops/backup-loop.sh"]
    volumes:
      - db_backups:/backups
      - ./scripts/ops/backup-db.sh:/opt/ops/backup-db.sh:ro
      - ./scripts/ops/backup-loop.sh:/opt/ops/backup-loop.sh:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "test -d /backups || exit 1"]
      interval: 1m
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  db_backups:
  import_storage:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
